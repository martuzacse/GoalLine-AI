{% load datetime_tags %}
{% if kickoff %}
{# Avoid the date filter on kickoff: exotic tz/naive mixes can raise; local-time.js rewrites text. #}
<time class="kickoff-local muted small" datetime="{{ kickoff|iso8601 }}" title="{{ kickoff|iso8601 }}">{{ kickoff|iso8601 }}</time>
{% else %}
<span class="muted small">TBC</span>
{% endif %}
